<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 36" role="img" aria-label="Cinelith">
  <!-- Website Nav mobile wordmark: Outfit light, uppercase, tracking ~0.28em, #d8dde6 on dark -->
  <style>
    .wm {
      fill: #1a1d24;
      font-family: Outfit, "Segoe UI", system-ui, sans-serif;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    @media (prefers-color-scheme: dark) {
      .wm { fill: #d8dde6; }
    }
  </style>
  <text class="wm" x="50%" y="52%" text-anchor="middle" dominant-baseline="middle">CINELITH</text>
</svg>
